# footypred configuration. Override with --config or FOOTY_CONFIG=path.
# Paths are relative to the project root unless absolute.

paths:
  data_dir: data
  db_file: data/footy.sqlite
  cache_dir: data/cache
  models_dir: models
  log_dir: logs

http:
  rate_limit_seconds: 3.0       # minimum gap between requests to one host
  timeout_seconds: 30
  max_retries: 4
  cache_ttl_hours: 12           # disk cache for scraped pages

leagues:                        # football-data.co.uk code -> metadata
  E0:  {name: Premier League, country: England,     understat: EPL}
  SP1: {name: La Liga,        country: Spain,       understat: La_liga}
  I1:  {name: Serie A,        country: Italy,       understat: Serie_A}
  D1:  {name: Bundesliga,     country: Germany,     understat: Bundesliga}
  F1:  {name: Ligue 1,        country: France,      understat: Ligue_1}
  N1:  {name: Eredivisie,     country: Netherlands}
  P1:  {name: Primeira Liga,  country: Portugal}
  T1:  {name: Süper Lig,      country: Turkey}
  NOR: {name: Eliteserien,    country: Norway,      couk_extra: true}
  CL:  {name: Champions League, country: Europe,    cup: true}

seasons: [2021, 2022, 2023, 2024, 2025, 2026]   # season = year it starts

sources:                        # each source fails in isolation
  football_data: true           # results, HT, shots, corners, cards, odds
  understat: true               # xG
  clubelo: true                 # external Elo
  transfermarkt: false          # squad market values (slow, opt-in)
  fifa: true                    # international rankings
  weather: false                # Open-Meteo match-day weather (opt-in)

features:
  windows: [5, 10]              # short / long rolling windows (matches)
  ew_halflife: 8                # exponentially-weighted form half-life (matches)
  venue_window: 8               # home-only / away-only window
  h2h_matches: 6
  min_history: 3                # matches before a team's features are "trusted"
  rt_lr: 0.01                   # goals-based rating learning rate  } auto-tuned
  rx_lr: 0.03                   # xG-blend rating learning rate     } by `footy
  rx_xg_weight: 0.75            # xG share of the blend target       } train`
  auto_tune_ratings: true
  elo_k: 20

training:
  cv_min_train_seasons: 2       # expanding window: first test season = 3rd
  dc_half_life_days: 480        # Dixon-Coles time decay (tuned by CV)
  dc_half_life_grid: [240, 480, 720, 1000, 1500]
  random_state: 42
  models: [poisson, dixon_coles, bayesian, xgboost, lightgbm, catboost,
           random_forest, neural_net]
  direct_markets: true          # per-market classifiers; used per market only
                                # where they beat calibration-only out of sample
  max_goals: 10
  halftime: true                # also train the first-half model (HT 1X2, O/U, BTTS)
  ht_models: [poisson, dixon_coles]

prediction:
  min_confidence_warn: 35

picks:                          # last-5 form check + best pick
  window: 5                     # last N matches / home / away / vs similar opponents / H2H
  style: balanced               # safe: fair odds 1.15-1.60 · balanced: 1.25-2.20 · bold: 1.60-3.50
                                # (each style also sets min_model / min_form; override below)
  form_weight: 0.6              # 1.0 = form decides alone, 0.0 = model alone
  min_lift: 0.05                # must beat the league's typical rate for that selection
                                # by 5 points (0 = allow "safe but ordinary" picks)
  # min_odds: 1.25              # explicit overrides of the style, if you want them
  # max_odds: 2.20
  # markets: [1x2, totals, btts, team_totals]
  # directions: [over, under]   # goal lines (total + team goals); [over] = never pick unders

image:                          # reading fixtures from screenshots
  engine: auto                  # auto | ocr (offline) | claude (needs `pip install
                                #   anthropic` + API key; sends the image to Anthropic)
  claude_model: claude-opus-5-5

# ---------------------------------------------------------------- your data
local_data:                     # the match file the whole system reads
  csv: data/matches.csv         # path on your PC (absolute, or relative to the project)
  auto_import: true             # re-import automatically whenever the file changes
  aliases: data/aliases.csv     # optional: two columns "from,to" to merge team names

football_data_org:              # `footy data download` / `footy data update`
  # api_key: ...                # better: set the environment variable FOOTBALL_DATA_API_KEY
  base_url: https://api.football-data.org/v4
  min_interval_seconds: 6.5     # free plan allows 10 requests a minute
  first_season: 2022            # season = the year it starts (2022 = 2022/23)
  fallback_football_data_co_uk: true   # fill domestic leagues/seasons outside your plan
  competitions:                 # our code: football-data.org code (or area + name to look it up)
    E0:  {code: PL,  name: Premier League}
    F1:  {code: FL1, name: Ligue 1}
    D1:  {code: BL1, name: Bundesliga}
    SP1: {code: PD,  name: La Liga}
    N1:  {code: DED, name: Eredivisie}
    I1:  {code: SA,  name: Serie A}
    CL:  {code: CL,  name: Champions League, cup: true}
    T1:  {area: Turkey, name: Süper Lig, couk: T1}
    NOR: {area: Norway, name: Eliteserien, couk: NOR, calendar_year: true}

