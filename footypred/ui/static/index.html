<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>footypred</title>
<style>
:root {
  --surface: #fcfcfb; --page: #f4f4f1; --card: #ffffff;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --baseline: #c3c2b7; --ring: rgba(11,11,11,0.10);
  --home: #2a78d6; --away: #e34948; --neutral: #b5b3ac; --yes: #4a3aa7;
  --accent: #2a78d6; --accent-ink: #ffffff; --warn-bg: #fff4dc; --warn-ink: #7a5200;
  --on-yes: #ffffff; --good: #006300;
  --err-bg: #fde8e8; --err-ink: #8f1f1f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface: #1a1a19; --page: #0d0d0d; --card: #1f1f1d;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --baseline: #383835; --ring: rgba(255,255,255,0.10);
    --home: #3987e5; --away: #e66767; --neutral: #6b6a64; --yes: #9085e9; --on-yes: #0b0b0b; --good: #0ca30c;
    --accent: #3987e5; --warn-bg: #3a2f12; --warn-ink: #f3c96b;
    --err-bg: #3b1a1a; --err-ink: #f2a3a3;
  }
}
:root[data-theme="dark"] {
  --surface: #1a1a19; --page: #0d0d0d; --card: #1f1f1d;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --baseline: #383835; --ring: rgba(255,255,255,0.10);
  --home: #3987e5; --away: #e66767; --neutral: #6b6a64; --yes: #9085e9; --on-yes: #0b0b0b; --good: #0ca30c;
  --accent: #3987e5; --warn-bg: #3a2f12; --warn-ink: #f3c96b;
  --err-bg: #3b1a1a; --err-ink: #f2a3a3;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { background: var(--surface); border-bottom: 1px solid var(--ring); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
.top { display: flex; align-items: center; gap: 16px; padding: 14px 0; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; }
.status { color: var(--muted); font-size: 13px; flex: 1; min-width: 200px; }
nav { display: flex; gap: 4px; }
nav button { background: none; border: 0; color: var(--ink-2); font: inherit; padding: 6px 12px;
  border-radius: 8px; cursor: pointer; }
nav button[aria-selected="true"] { background: var(--page); color: var(--ink); font-weight: 600; }
main { padding: 20px 0 48px; }
.card { background: var(--card); border: 1px solid var(--ring); border-radius: 12px; padding: 18px; }
.card h2 { margin: 0 0 12px; font-size: 15px; display: flex; justify-content: space-between;
  align-items: baseline; gap: 8px; }
.card h2 .conf { font-weight: 400; color: var(--muted); font-size: 13px; }
form.picker { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: end; }
.side { display: grid; grid-template-columns: 1fr 1.3fr; gap: 8px; }
.side .tag { grid-column: 1 / -1; font-size: 12px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; }
.side.home .tag { color: var(--home); } .side.away .tag { color: var(--away); }
label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
select, input[type="date"] { font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--baseline); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
.vs { align-self: center; color: var(--muted); font-weight: 600; padding-bottom: 8px; }
.row2 { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.row2 label.inline { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 14px;
  padding-bottom: 9px; }
.btns { display: flex; gap: 10px; margin-left: auto; align-items: end; }
button.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px;
  padding: 10px 22px; font: inherit; font-weight: 600; cursor: pointer; }
button.primary:disabled { opacity: .6; cursor: progress; }
button.ghost { background: none; border: 1px solid var(--baseline); color: var(--ink-2); border-radius: 8px;
  padding: 9px 12px; font: inherit; cursor: pointer; }
.spacer { flex: 1; }
.msg { margin-top: 14px; padding: 10px 14px; border-radius: 8px; font-size: 14px; }
.msg.err { background: var(--err-bg); color: var(--err-ink); }
.msg.warn { background: var(--warn-bg); color: var(--warn-ink); }
.headline { margin: 24px 0 14px; }
.headline h1 { font-size: 26px; margin: 0; letter-spacing: -0.01em; }
.headline .meta { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: minmax(0, 9em) 1fr 3.4em; gap: 10px; align-items: center;
  font-size: 14px; }
.bar .lbl { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { height: 12px; background: var(--grid); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 4px; }
.bar .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.split { display: flex; height: 34px; border-radius: 6px; overflow: hidden; gap: 2px; font-size: 13px; }
.split div { display: flex; align-items: center; justify-content: center; white-space: nowrap;
  overflow: hidden; padding: 0 6px; }
.split .yes { background: var(--yes); color: var(--on-yes); } .split .no { background: var(--neutral); color: var(--ink); }
.pick { margin-top: 12px; font-size: 14px; color: var(--ink-2); }
.pick b { color: var(--ink); }
.chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px;
  border: 1px solid var(--baseline); color: var(--ink-2); margin-left: 6px; vertical-align: 1px; }
.chip.strong { border-color: var(--ink-2); color: var(--ink); font-weight: 600; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: right; font-weight: 500; color: var(--muted); font-size: 12px; padding: 4px 6px; }
th:first-child, td:first-child { text-align: left; }
td { padding: 6px; border-top: 1px solid var(--grid); text-align: right; font-variant-numeric: tabular-nums; }
td.team { font-weight: 600; } td .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px;
  margin-right: 6px; }
.scores { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.scores span { background: var(--card); border: 1px solid var(--ring); border-radius: 8px; padding: 4px 10px;
  font-size: 14px; font-variant-numeric: tabular-nums; }
.section { margin-top: 16px; }
.ev { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.ev h3 { margin: 0 0 6px; font-size: 14px; }
.ev ul { list-style: none; margin: 0; padding: 0; font-size: 14px; color: var(--ink-2); }
.ev li { padding: 3px 0; border-top: 1px solid var(--grid); display: flex; justify-content: space-between; gap: 8px; }
.ev li b { color: var(--ink); font-variant-numeric: tabular-nums; }
.ev-list ul { list-style: none; margin: 0; padding: 0; font-size: 14px; color: var(--ink-2); }
.drivers li { display: block; padding: 5px 0; border-top: 1px solid var(--grid); }
.drivers li b { color: var(--ink); }
.dash img { width: 100%; height: auto; display: block; border-radius: 8px; border: 1px solid var(--ring); }
.dash .tools { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
a { color: var(--accent); }
pre { white-space: pre-wrap; font: 12.5px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color: var(--ink-2); margin: 0; overflow-x: auto; }
fieldset.mk { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
fieldset.mk legend { font-size: 12px; color: var(--muted); padding: 0; margin-bottom: 4px; }
fieldset.mk label.inline { padding-bottom: 0; }
input[type="number"] { font: inherit; color: var(--ink); background: var(--surface); width: 6em;
  border: 1px solid var(--baseline); border-radius: 8px; padding: 8px 10px; }
.best { border-left: 4px solid var(--accent); }
.best .kicker { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
  color: var(--accent); }
.best .top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px;
  align-items: baseline; margin: 4px 0 10px; }
.best .big { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.best .nums { display: flex; gap: 18px; font-size: 14px; color: var(--ink-2); flex-wrap: wrap; }
.best .nums b { color: var(--ink); font-size: 18px; font-variant-numeric: tabular-nums; }
ul.ticks { list-style: none; margin: 0 0 10px; padding: 0; font-size: 14px; color: var(--ink-2); }
ul.ticks li { padding: 3px 0; } ul.ticks li::before { content: "✓ "; color: var(--good); font-weight: 700; }
.tags { font-size: 14px; color: var(--ink-2); margin: 4px 0; } .tags b { color: var(--ink); }
.scroll { overflow-x: auto; }
table.form td, table.form th { white-space: nowrap; }
table.form th.grp { text-align: center; color: var(--ink-2); font-weight: 600; border-bottom: 1px solid var(--grid); }
details { margin-top: 12px; font-size: 14px; color: var(--ink-2); }
details summary { cursor: pointer; color: var(--ink); }
details ol { margin: 6px 0 0; padding-left: 20px; }
.drop { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 120px;
  border: 2px dashed var(--baseline); border-radius: 12px; padding: 16px; cursor: pointer; color: var(--ink-2);
  font-size: 14px; }
.drop.over, .drop:focus-within { border-color: var(--accent); background: var(--surface); }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
img.preview { max-width: 100%; max-height: 320px; margin-top: 12px; border-radius: 8px; border: 1px solid var(--ring); }
table.fx select, table.fx input[type="date"] { min-width: 9em; padding: 6px 8px; }
table.fx td { vertical-align: middle; }
.src { color: var(--muted); font-size: 12px; max-width: 18em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 12px; }
button.small { padding: 5px 10px; font-size: 13px; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
@media (max-width: 820px) {
  form.picker { grid-template-columns: 1fr; }
  .vs { padding: 0; text-align: center; }
  .grid2, .ev { grid-template-columns: 1fr; }
  .bar { grid-template-columns: minmax(0, 7em) 1fr 3.2em; }
}
@media (max-width: 420px) { .side { grid-template-columns: 1fr; } }
@media (max-width: 820px) {
  table.fx thead, table.batch thead { display: none; }
  table.fx tr { display: grid; grid-template-columns: auto 1fr 1fr; gap: 6px; padding: 10px 0;
    border-top: 1px solid var(--grid); align-items: center; }
  table.fx td { border: 0; padding: 0; text-align: left; }
  table.fx td:nth-child(n+4) { grid-column: 2 / 4; }
  table.fx select { min-width: 0; width: 100%; }
  table.batch tr { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px 10px; padding: 10px 0;
    border-top: 1px solid var(--grid); }
  table.batch td { border: 0; padding: 0; text-align: left; white-space: normal; }
  table.batch td.team, table.batch td.pick-cell { grid-column: 1 / -1; }
  table.batch td[data-label]::before { content: attr(data-label); display: block; font-size: 11px;
    color: var(--muted); }
  table.batch td.pick-cell::before { display: inline; margin-right: 6px; }
}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div class="brand">footypred</div>
    <div class="status" id="status">loading…</div>
    <nav role="tablist">
      <button role="tab" aria-selected="true" data-tab="predict">Predict</button>
      <button role="tab" aria-selected="false" data-tab="image">From image</button>
      <button role="tab" aria-selected="false" data-tab="report">Model report</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="tab-predict">
    <form class="card picker" id="picker">
      <div class="side home">
        <div class="tag">Home</div>
        <label>League<select id="home-league"></select></label>
        <label>Team<select id="home-team"></select></label>
      </div>
      <div class="vs">vs</div>
      <div class="side away">
        <div class="tag">Away</div>
        <label>League<select id="away-league"></select></label>
        <label>Team<select id="away-team"></select></label>
      </div>
      <div class="row2">
        <label>Match date<input type="date" id="date"></label>
        <label class="inline"><input type="checkbox" id="neutral"> Neutral venue</label>
        <fieldset class="mk" id="markets"><legend>Best pick from</legend>
          <label class="inline"><input type="checkbox" value="1x2" checked> 1X2</label>
          <label class="inline"><input type="checkbox" value="totals" checked> Total goals</label>
          <label class="inline"><input type="checkbox" value="btts" checked> BTTS</label>
          <label class="inline"><input type="checkbox" value="team_totals" checked> Team goals</label>
        </fieldset>
        <label>Pick style<select id="style">
          <option value="safe">Safe · odds 1.15–1.60</option>
          <option value="balanced" selected>Balanced · odds 1.25–2.20</option>
          <option value="bold">Bold · odds 1.60–3.50</option>
        </select></label>
        <label>Min odds<input type="number" id="min-odds" min="1" max="10" step="0.01" placeholder="auto"></label>
        <div class="btns">
          <button type="button" class="ghost" id="swap" title="Swap home and away">⇄ Swap</button>
          <button type="submit" class="primary" id="go">Predict</button>
        </div>
      </div>
    </form>
    <div id="error" class="msg err hidden"></div>
    <div id="result" class="hidden"></div>
  </section>

  <section id="tab-image" class="hidden">
    <div class="card">
      <h2>Read fixtures from a screenshot <span class="conf">fixture lists, betting coupons, match cards — many matches per image</span></h2>
      <label class="drop" id="drop" tabindex="0">
        <input type="file" id="img-file" accept="image/*" class="visually-hidden">
        <span><b>Drop an image here</b>, paste it with Ctrl/⌘+V, or click to choose a file</span>
      </label>
      <div class="row2" style="margin-top:12px">
        <label>Reader<select id="img-engine">
          <option value="auto">Auto (offline OCR first)</option>
          <option value="ocr">Offline OCR only</option>
          <option value="claude">Claude vision (needs API key; sends the image to Anthropic)</option>
        </select></label>
        <label>Date if not shown<input type="date" id="img-date"></label>
      </div>
      <img id="img-preview" class="preview hidden" alt="Uploaded screenshot">
    </div>
    <div id="img-msg" class="msg hidden"></div>
    <div id="img-fixtures" class="card section hidden"></div>
    <div id="img-results" class="card section hidden"></div>
  </section>

  <section id="tab-report" class="hidden">
    <div class="card"><div id="report-body" class="muted">Loading model report…</div></div>
  </section>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const pct = (p, d = 0) => (100 * p).toFixed(d) + "%";
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "style") n.style.cssText = v;
    else n.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) if (k != null) n.append(k instanceof Node ? k : String(k));
  return n;
}
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem("footy:" + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("footy:" + k, JSON.stringify(v)); } catch {} },
};
async function api(path) {
  const r = await fetch(path);
  const body = await r.json().catch(() => ({ error: "bad response" }));
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}

// ------------------------------------------------------------ pickers
let LEAGUES = [];
const teamCache = {};
async function teamsFor(code) {
  if (!(code in teamCache)) teamCache[code] = await api("/api/teams?league=" + encodeURIComponent(code));
  return teamCache[code];
}
function fillLeagues(sel) {
  sel.replaceChildren(...LEAGUES.map((l) =>
    el("option", { value: l.code }, l.name + (l.country ? ` (${l.country})` : "") + ` · ${l.teams}`)),
    el("option", { value: "" }, "All leagues"));
}
async function fillTeams(leagueSel, teamSel, prefer) {
  const list = await teamsFor(leagueSel.value);
  const keep = prefer || teamSel.value;
  teamSel.replaceChildren(...list.map((t) => el("option", { value: t }, t)));
  if (list.includes(keep)) teamSel.value = keep;
}
let awayFollows = true;
async function initPickers() {
  LEAGUES = await api("/api/leagues");
  fillLeagues($("home-league")); fillLeagues($("away-league"));
  const last = store.get("last") || {};
  if (last.hl != null) $("home-league").value = last.hl;
  if (last.al != null) { $("away-league").value = last.al; awayFollows = last.al === last.hl; }
  await fillTeams($("home-league"), $("home-team"), last.ht);
  await fillTeams($("away-league"), $("away-team"), last.at);
  if (!last.at && $("away-team").options.length > 1) $("away-team").selectedIndex = 1;
  if (last.neutral) $("neutral").checked = true;
}
$("home-league").addEventListener("change", async () => {
  await fillTeams($("home-league"), $("home-team"));
  if (awayFollows) {
    $("away-league").value = $("home-league").value;
    await fillTeams($("away-league"), $("away-team"));
    if ($("away-team").value === $("home-team").value && $("away-team").options.length > 1)
      $("away-team").selectedIndex = 1;
  }
});
$("away-league").addEventListener("change", async () => {
  awayFollows = $("away-league").value === $("home-league").value;
  await fillTeams($("away-league"), $("away-team"));
});
$("swap").addEventListener("click", async () => {
  const [hl, ht, al, at] = [$("home-league").value, $("home-team").value, $("away-league").value, $("away-team").value];
  $("home-league").value = al; await fillTeams($("home-league"), $("home-team"), at);
  $("away-league").value = hl; await fillTeams($("away-league"), $("away-team"), ht);
});

// ------------------------------------------------------------ render
const strongChip = (s) => el("span", { class: "chip" + (s === "strong" ? " strong" : "") }, s);
function barRow(label, p, color) {
  return el("div", { class: "bar" }, el("span", { class: "lbl", title: label }, label),
    el("div", { class: "track" }, el("div", { class: "fill", style: `width:${pct(p, 1)};background:${color}` })),
    el("span", { class: "val" }, pct(p)));
}
function splitBar(yesLbl, noLbl, p) {
  return el("div", { class: "split", role: "img", "aria-label": `${yesLbl} ${pct(p)}, ${noLbl} ${pct(1 - p)}` },
    el("div", { class: "yes", style: `flex:${p}` }, `${yesLbl} ${pct(p)}`),
    el("div", { class: "no", style: `flex:${1 - p}` }, `${noLbl} ${pct(1 - p)}`));
}
const pickLine = (pk) => el("div", { class: "pick" }, "Pick: ", el("b", {}, pk.pick),
  ` ${pct(pk.prob, 1)} · fair odds ${pk.fair_odds.toFixed(2)}`, strongChip(pk.strength));
function card(title, conf, ...body) {
  return el("div", { class: "card" }, el("h2", {}, title, el("span", { class: "conf" }, `confidence ${conf}/100`)), ...body);
}
function evidenceList(name, ev) {
  const L = ev.last, V = ev.venue;
  if (!L.n) return el("div", {}, el("h3", {}, name), el("p", { class: "muted" }, "No match history on record."));
  const li = (k, v) => el("li", {}, el("span", {}, k), el("b", {}, v));
  const items = [
    li(`Last ${L.n} results`, `W${L.w} D${L.d} L${L.l}`),
    li("Goals for / against per game", `${L.gf.toFixed(2)} / ${L.ga.toFixed(2)}`),
  ];
  if (L.xgf != null) items.push(li("xG for / against per game", `${L.xgf.toFixed(2)} / ${L.xga.toFixed(2)}`));
  items.push(li("Scored in", `${L.scored}/${L.n}`), li("Scored 2+", `${L.scored2}/${L.n}`),
    li("Scored 3+", `${L.scored3}/${L.n}`), li("Conceded in", `${L.conceded}/${L.n}`),
    li("BTTS", `${L.btts}/${L.n}`), li("Over 2.5", `${L.o25}/${L.n}`));
  if (V.n) items.push(li(`${ev.venue_label[0].toUpperCase() + ev.venue_label.slice(1)} games: scored / conceded`,
    `${V.scored}/${V.n} · ${V.conceded}/${V.n}`), li(`${ev.venue_label[0].toUpperCase() + ev.venue_label.slice(1)} games: BTTS / O2.5`,
    `${V.btts}/${V.n} · ${V.o25}/${V.n}`));
  return el("div", {}, el("h3", {}, name), el("ul", {}, items));
}
function bestPickCard(p) {
  const f = p.form, b = f.best_pick;
  const st = f.settings || {};
  const kids = [el("div", { class: "kicker" }, `★ Best pick — last ${f.window} form + model · ${st.style || ""} style, odds ${(st.min_odds || 0).toFixed(2)}–${(st.max_odds || 0).toFixed(2)}`)];
  if (f.gap && f.gap.lopsided)
    kids.push(el("div", { class: "pick", style: "margin:6px 0 0" }, el("b", {}, "Big strength gap: "),
      `${f.gap.favourite} win ${pct(f.gap.win_prob)} (Elo gap ${Math.abs(f.gap.elo_gap).toFixed(0)}) — the favourite's safe lines are too short, so bigger lines are considered.`));
  if (f.too_short)
    kids.push(el("div", { class: "pick", style: "margin:4px 0 0" },
      `↑ ${f.too_short.label} is ${pct(f.too_short.model_prob)} but only ${f.too_short.fair_odds.toFixed(2)} — too short, looked further up the ladder.`));
  if (b) {
    kids.push(el("div", { class: "top" }, el("div", { class: "big" }, b.label),
      el("div", { class: "nums" }, el("span", {}, "model ", el("b", {}, pct(b.model_prob))),
        el("span", {}, "form ", el("b", {}, pct(b.form_rate))),
        el("span", {}, "fair odds ", el("b", {}, b.fair_odds.toFixed(2))))));
    kids.push(el("div", { class: "pick", style: "margin:0 0 8px" }, b.agreement));
    kids.push(el("ul", { class: "ticks" }, [...b.evidence].sort((x, y) => y.weight - x.weight).slice(0, 4)
      .map((e) => el("li", {}, `${e.event}: ${e.hits}/${e.n} (${e.window})`))));
  } else {
    kids.push(el("div", { class: "top" }, el("div", { class: "big" }, "No clear pick")),
      el("p", { class: "pick" }, "No selection is backed by both recent form and the model with the current market and odds settings."));
  }
  for (const [side, team, venue] of [["home", p.home, "at home"], ["away", p.away, "away"]]) {
    const tags = f.profiles[side][venue].length ? f.profiles[side][venue] : f.profiles[side].overall;
    if (tags.length) kids.push(el("div", { class: "tags" }, el("b", {}, `${team} ${venue}: `), tags.join(" · ")));
    const sim = f.profiles[side]["vs similar"] || [];
    const other = side === "home" ? p.away : p.home;
    if (sim.length) kids.push(el("div", { class: "tags" }, el("b", {}, `${team} vs teams rated like ${other}: `), sim.join(" · ")));
  }
  kids.push(el("div", { class: "scroll", style: "margin-top:10px" }, el("table", {},
    el("thead", {}, el("tr", {}, ["Best in each market", "Selection", "Model", "Odds", "Form", ""].map((t) => el("th", {}, t)))),
    el("tbody", {}, Object.values(f.best_by_market).map((r) => el("tr", {},
      el("td", {}, r.market_name), el("td", {}, r.label), el("td", {}, pct(r.model_prob)),
      el("td", {}, r.fair_odds.toFixed(2)),
      el("td", {}, r.form_rate == null ? "–" : pct(r.form_rate)),
      el("td", {}, r.eligible ? strongChip("pick") : el("span", { class: "chip" }, "no clear pick"))))))));
  for (const c of f.conflicts || [])
    kids.push(el("div", { class: "msg warn", style: "margin-top:8px" },
      `Form disagrees: ${c.label} — model ${pct(c.model_prob)}, but it landed in only ${pct(c.form_rate)} of recent games.`));
  return el("div", { class: "card best" }, kids);
}
function formCard(p) {
  const f = p.form, c = f.counts, n = f.window;

                ["away_last", "last " + n], ["away_home", "home"], ["away_away", "away"], ["away_similar", "vs similar"],
                ["h2h", "meetings"]];
  const rows = [["Results W-D-L", null], ["Scored 1+", "scored"], ["Scored 2+", "scored2"], ["Scored 3+", "scored3"],
    ["Conceded 1+", "conceded"], ["Conceded 2+", "conceded2"], ["Clean sheet", "clean_sheets"],
    ["Failed to score", "failed_to_score"], ["BTTS", "btts"], ["Over 1.5", "o15"], ["Over 2.5", "o25"], ["Over 3.5", "o35"]];
  const cell = (k, key) => { const x = c[k]; if (!x.n) return "–"; return key ? `${x[key]}/${x.n}` : `${x.w}-${x.d}-${x.l}`; };
  const table = el("table", { class: "form" },
    el("thead", {}, el("tr", {}, el("th", {}, ""), el("th", { class: "grp", colspan: "4" }, p.home),
      el("th", { class: "grp", colspan: "4" }, p.away), el("th", { class: "grp" }, "H2H")),
      el("tr", {}, el("th", {}, ""), cols.map(([, l]) => el("th", {}, l)))),
    el("tbody", {}, rows.map(([lbl, key]) => el("tr", {}, el("td", {}, lbl), cols.map(([k]) => el("td", {}, cell(k, key)))))));
  const lists = [["home_last", `${p.home} — last ${n}`], ["away_last", `${p.away} — last ${n}`], ["h2h", "Head-to-head"]]
    .filter(([k]) => c[k].n).map(([k, t]) => el("div", {}, el("b", {}, t), el("ol", {}, c[k].results.map((r) => el("li", {}, r)))));
  return el("div", { class: "card section" }, el("h2", {}, `Form check — last ${n}`,
      el("span", { class: "conf" }, `H2H counted from ${p.home}'s side`)),
    el("div", { class: "scroll" }, table),
    el("details", {}, el("summary", {}, "Show the matches"), el("div", { class: "ev", style: "margin-top:8px" }, lists)));
}
function render(p) {
  const m = p.markets, pk = p.picks, c = p.confidence, eg = p.expected_goals;
  const out = [];
  out.push(el("div", { class: "headline" }, el("h1", {}, `${p.home} vs ${p.away}`),
    el("div", { class: "meta" }, `${p.league_name} · ${p.date}${p.neutral ? " · neutral venue" : ""} · xG ${eg.home.toFixed(2)} – ${eg.away.toFixed(2)} (total ${eg.total.toFixed(2)}) · overall confidence ${c.overall}/100 · model ${p.model}`)));
  for (const w of p.warnings || []) out.push(el("div", { class: "msg warn" }, w));

  const tt = (side) => m.team_totals[side];
  const ttRow = (side, team, color) => el("tr", {}, el("td", { class: "team" },
    el("span", { class: "sw", style: `background:${color}` }), team),
    el("td", {}, pct(tt(side)["over_0.5"])), el("td", {}, pct(tt(side)["over_1.5"])), el("td", {}, pct(tt(side)["over_2.5"])));
  const ttPicks = Object.entries(pk.team_totals).map(([team, lines]) => el("div", { class: "pick" },
    el("b", {}, team + ": "), lines.map((l, i) => [i ? " · " : "", `${l.pick} ${pct(l.prob)}`, strongChip(l.strength)])));
  if (p.form) out.push(bestPickCard(p));
  out.push(el("div", { class: "grid2" },
    card("1X2 — match result", c["1x2"], el("div", { class: "bars" },
      barRow(`${p.home} win`, m["1x2"].home, "var(--home)"), barRow("Draw", m["1x2"].draw, "var(--neutral)"),
      barRow(`${p.away} win`, m["1x2"].away, "var(--away)")), pickLine(pk["1x2"])),
    card("Total goals over / under", c["over_under_2.5"], splitBar("Over 2.5", "Under 2.5", m["over_under_2.5"].over),
      m.totals ? el("div", { class: "bars", style: "margin-top:10px" },
        ["1.5", "3.5"].filter((l) => m.totals["over_" + l] != null).map((l) => barRow(`Over ${l}`, m.totals["over_" + l], "var(--yes)"))) : null,
      pickLine(pk["over_under_2.5"])),
    card("Team goals over/under 0.5 · 1.5 · 2.5", c.team_totals,
      el("table", {}, el("thead", {}, el("tr", {}, el("th", {}, ""), el("th", {}, "Over 0.5"), el("th", {}, "Over 1.5"), el("th", {}, "Over 2.5"))),
        el("tbody", {}, ttRow("home", p.home, "var(--home)"), ttRow("away", p.away, "var(--away)"))), ttPicks),
    card("Both teams to score", c.btts, splitBar("Yes", "No", m.btts.yes), pickLine(pk.btts))));

  out.push(el("div", { class: "scores" }, el("span", { class: "muted", style: "border:0;background:none;padding-left:0" }, "Most likely scores:"),
    p.top_scores.slice(0, 6).map(([s, q]) => el("span", {}, `${s}  ${pct(q, 1)}`))));

  if (p.form) out.push(formCard(p));
  const h = p.evidence.h2h;
  out.push(el("div", { class: "card section" }, el("h2", {}, "Past-match evidence"),
    el("div", { class: "ev" }, evidenceList(p.home, p.evidence.home), evidenceList(p.away, p.evidence.away)),
    el("p", { class: "pick" }, h ? [el("b", {}, `Head-to-head (last ${h.n}): `),
      `${p.home} ${h.home_w} · draws ${h.d} · ${p.away} ${h.away_w} · BTTS ${h.btts}/${h.n} · O2.5 ${h.o25}/${h.n} · ${h.goals.toFixed(1)} goals/game · recent: ${h.scores.join(" | ")}`]
      : "Head-to-head: no previous meetings on record.")));

  const dr = Object.values(p.drivers || {});
  if (dr.length) out.push(el("div", { class: "card section" }, el("h2", {}, "What moved each market"),
    el("div", { class: "drivers ev-list" }, el("ul", {}, dr.map((d) => el("li", {}, el("b", {}, d.label + ": "),
      d.items.slice(0, 3).map(([n, v], i) => `${i ? " · " : ""}${v >= 0 ? "+" : "−"}${Math.abs(v).toFixed(2)} ${n}`)))))));

  const mm = Object.entries(p.model_markets);
  out.push(el("div", { class: "card section" }, el("h2", {}, "Model comparison", el("span", { class: "conf" }, `final = ${p.model}, reconciled`)),
    el("div", { style: "overflow-x:auto" }, el("table", {},
      el("thead", {}, el("tr", {}, ["Model", "Home", "Draw", "Away", "Over 2.5", "BTTS", "Home o1.5", "Away o1.5"].map((t) => el("th", {}, t)))),
      el("tbody", {}, [["final", m], ...mm].map(([n, x]) => el("tr", {}, el("td", { class: n === "final" ? "team" : "" }, n),
        el("td", {}, pct(x["1x2"].home)), el("td", {}, pct(x["1x2"].draw)), el("td", {}, pct(x["1x2"].away)),
        el("td", {}, pct(x["over_under_2.5"].over)), el("td", {}, pct(x.btts.yes)),
        el("td", {}, pct(x.team_totals.home["over_1.5"])), el("td", {}, pct(x.team_totals.away["over_1.5"])))))))));

  if (p.chart_png) {
    const src = "data:image/png;base64," + p.chart_png;
    const fname = `${p.home}_vs_${p.away}_${p.date}.png`.replace(/[^\w.-]+/g, "_");
    out.push(el("div", { class: "card section dash" },
      el("div", { class: "tools" }, el("h2", { style: "margin:0" }, "Analysis dashboard"),
        el("a", { href: src, download: fname }, "Download PNG")),
      el("img", { src, alt: `Analysis dashboard for ${p.home} vs ${p.away}: 1X2, over/under, team goals, BTTS, Poisson and Normal distributions, score heatmap, model divergence, evidence and reliability` })));
  }
  $("result").replaceChildren(...out);
  $("result").classList.remove("hidden");
}

$("picker").addEventListener("submit", async (e) => {
  e.preventDefault();
  const home = $("home-team").value, away = $("away-team").value;
  $("error").classList.add("hidden");
  if (!home || !away) return showError("Choose both teams.");
  if (home === away) return showError("Home and away must be different teams.");
  store.set("last", { hl: $("home-league").value, ht: home, al: $("away-league").value, at: away, neutral: $("neutral").checked });
  const go = $("go"); go.disabled = true; go.textContent = "Predicting…";
  try {
    const markets = [...document.querySelectorAll("#markets input:checked")].map((x) => x.value);
    if (!markets.length) throw new Error("Tick at least one market for the best pick.");
    const q = new URLSearchParams({ home, away, date: $("date").value, neutral: $("neutral").checked ? "1" : "0",
      markets: markets.join(","), style: $("style").value });
    if ($("min-odds").value) q.set("min_odds", $("min-odds").value);
    render(await api("/api/predict?" + q));
    $("result").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (err) { showError(err.message); }
  finally { go.disabled = false; go.textContent = "Predict"; }
});
function showError(t) { $("error").textContent = t; $("error").classList.remove("hidden"); }

// ------------------------------------------------------------ tabs
let reportLoaded = false;
document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", async () => {
  document.querySelectorAll("nav button").forEach((x) => x.setAttribute("aria-selected", x === b));
  for (const t of ["predict", "image", "report"]) $("tab-" + t).classList.toggle("hidden", b.dataset.tab !== t);
  if (b.dataset.tab === "report" && !reportLoaded) {
    try {
      const r = await api("/api/evaluation");
      $("report-body").replaceChildren(el("h2", {}, `Model ${r.version}`, el("span", { class: "conf" }, `trained ${r.created}`)),
        el("div", { class: "dash" }, el("img", { src: "data:image/png;base64," + r.chart_png, alt: "Out-of-sample evaluation: skill per candidate and market, calibration error, reliability diagrams" })),
        el("pre", { style: "margin-top:16px" }, r.report_text));
      $("report-body").classList.remove("muted");
      reportLoaded = true;
    } catch (err) { $("report-body").textContent = "Could not load report: " + err.message; }
  }
}));


// ------------------------------------------------------------ from image
let TEAM_INDEX = null;
async function teamIndex() { if (!TEAM_INDEX) TEAM_INDEX = await api("/api/team-index"); return TEAM_INDEX; }
function teamSelect(value) {
  const sel = el("select", {});
  for (const l of LEAGUES) {
    const g = el("optgroup", { label: l.name });
    for (const t of Object.keys(TEAM_INDEX).filter((t) => TEAM_INDEX[t] === l.code).sort())
      g.append(el("option", { value: t }, t));
    sel.append(g);
  }
  if (value) sel.value = value;
  return sel;
}
function imgMsg(text, kind) {
  const m = $("img-msg"); m.className = "msg " + (kind || ""); m.textContent = text;
  m.classList.toggle("hidden", !text);
}
function pickSettings() {
  const o = { markets: [...document.querySelectorAll("#markets input:checked")].map((x) => x.value).join(","),
              style: $("style").value };
  if ($("min-odds").value) o.min_odds = $("min-odds").value;
  return o;
}
function fixtureRow(f) {
  return el("tr", {},
    el("td", {}, el("input", { type: "checkbox", checked: "", "aria-label": "include" })),
    el("td", {}, teamSelect(f.home)), el("td", {}, teamSelect(f.away)),
    el("td", {}, el("input", { type: "date", value: f.date || $("img-date").value })),
    el("td", {}, f.time || ""),
    el("td", { class: "src", title: f.source || "" }, f.source ? `“${f.source}” · ${pct(f.confidence)}` : "added"));
}
function renderFixtures(res) {
  const box = $("img-fixtures");
  const rows = res.fixtures.map(fixtureRow);
  const tbody = el("tbody", {}, rows);
  const add = el("button", { type: "button", class: "ghost small" }, "+ Add fixture");
  add.addEventListener("click", () => tbody.append(fixtureRow({ home: "", away: "" })));
  const go = el("button", { type: "button", class: "primary" }, `Predict ${res.fixtures.length || ""} fixture${res.fixtures.length === 1 ? "" : "s"}`);
  go.addEventListener("click", () => predictAll(tbody, go));
  box.replaceChildren(
    el("h2", {}, `${res.fixtures.length} fixture${res.fixtures.length === 1 ? "" : "s"} found`,
      el("span", { class: "conf" }, `read with ${res.engine === "ocr" ? "offline OCR" : "Claude vision"} — check and edit before predicting`)),
    ...(res.warnings || []).map((w) => el("div", { class: "msg warn", style: "margin:0 0 8px" }, w)),
    ...(res.unmatched || []).map((u) => el("div", { class: "msg warn", style: "margin:0 0 8px" }, "Not in the database: " + u)),
    el("div", { class: "scroll" }, el("table", { class: "fx" },
      el("thead", {}, el("tr", {}, ["", "Home", "Away", "Date", "Time", "Read as"].map((t) => el("th", {}, t)))), tbody)),
    res.lines && res.lines.length ? el("details", {}, el("summary", {}, "Text read from the image"),
      el("pre", { style: "margin-top:6px" }, res.lines.join("\n"))) : null,
    el("div", { class: "actions" }, add, go));
  box.classList.remove("hidden");
}
async function readImage(file) {
  if (!file || !file.type.startsWith("image/")) return imgMsg("That isn't an image file.", "err");
  $("img-preview").src = URL.createObjectURL(file); $("img-preview").classList.remove("hidden");
  $("img-results").classList.add("hidden"); $("img-fixtures").classList.add("hidden");
  imgMsg("Reading the image…", "warn");
  try {
    await teamIndex();
    const r = await fetch("/api/image?engine=" + encodeURIComponent($("img-engine").value),
      { method: "POST", body: file, headers: { "Content-Type": file.type } });
    const res = await r.json();
    if (!r.ok) throw new Error(res.error || r.statusText);
    imgMsg(res.fixtures.length ? "" : "No fixtures recognised. Try a sharper screenshot, the Claude reader, or add them by hand below.", res.fixtures.length ? "" : "warn");
    renderFixtures(res);
  } catch (err) { imgMsg(err.message, "err"); }
}
async function predictAll(tbody, btn) {
  const rows = [...tbody.querySelectorAll("tr")].filter((tr) => tr.querySelector("input[type=checkbox]").checked)
    .map((tr) => { const s = tr.querySelectorAll("select"); return { home: s[0].value, away: s[1].value, date: tr.querySelector("input[type=date]").value }; });
  if (!rows.length) return imgMsg("Tick at least one fixture.", "warn");
  btn.disabled = true;
  const out = [];
  for (let i = 0; i < rows.length; i++) {
    btn.textContent = `Predicting ${i + 1}/${rows.length}…`;
    const f = rows[i];
    try {
      if (f.home === f.away) throw new Error("same team twice");
      const q = new URLSearchParams({ home: f.home, away: f.away, date: f.date, chart: "0", ...pickSettings() });
      out.push({ f, p: await api("/api/predict?" + q) });
    } catch (err) { out.push({ f, err: err.message }); }
  }
  btn.disabled = false; btn.textContent = "Predict again";
  renderBatch(out);
}
function renderBatch(out) {
  const rows = out.map(({ f, p, err }) => {
    if (err) return el("tr", {}, el("td", { class: "team" }, `${f.home} vs ${f.away}`), el("td", { colspan: "9", class: "pick-cell" }, "✗ " + err));
    const b = p.form && p.form.best_pick, m = p.markets;
    const open = el("button", { type: "button", class: "ghost small" }, "Open");
    open.addEventListener("click", () => openFixture(p.home, p.away, p.date));
    return el("tr", {}, el("td", { class: "team" }, `${p.home} vs ${p.away}`), el("td", { "data-label": "Date" }, p.date),
      el("td", { class: "pick-cell", "data-label": "Best pick" }, b ? el("b", {}, b.label) : el("span", { class: "muted" }, "no clear pick")),
      el("td", { "data-label": "Model" }, b ? pct(b.model_prob) : "–"), el("td", { "data-label": "Odds" }, b ? b.fair_odds.toFixed(2) : "–"),
      el("td", { "data-label": "Form" }, b ? pct(b.form_rate) : "–"),
      el("td", { "data-label": "1X2 H·D·A" }, `${pct(m["1x2"].home)} · ${pct(m["1x2"].draw)} · ${pct(m["1x2"].away)}`),
      el("td", { "data-label": "Over 2.5" }, pct(m["over_under_2.5"].over)), el("td", { "data-label": "BTTS" }, pct(m.btts.yes)), el("td", {}, open));
  });
  const box = $("img-results");
  box.replaceChildren(el("h2", {}, "Predictions", el("span", { class: "conf" }, "best pick = last-5 form + model · Open for the full analysis")),
    el("div", { class: "scroll" }, el("table", { class: "batch" },
      el("thead", {}, el("tr", {}, ["Fixture", "Date", "Best pick", "Model", "Odds", "Form", "1X2 H·D·A", "Over 2.5", "BTTS", ""].map((t) => el("th", {}, t)))),
      el("tbody", {}, rows))));
  box.classList.remove("hidden");
  box.scrollIntoView({ behavior: "smooth", block: "start" });
}
async function openFixture(home, away, date) {
  const idx = await teamIndex();
  document.querySelector('nav button[data-tab="predict"]').click();
  $("home-league").value = idx[home]; await fillTeams($("home-league"), $("home-team"), home);
  $("away-league").value = idx[away]; awayFollows = idx[home] === idx[away];
  await fillTeams($("away-league"), $("away-team"), away);
  $("date").value = date;
  $("picker").requestSubmit();
}
$("img-file").addEventListener("change", (e) => readImage(e.target.files[0]));
const drop = $("drop");
["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", (e) => readImage(e.dataTransfer.files[0]));
document.addEventListener("paste", (e) => {
  if ($("tab-image").classList.contains("hidden")) return;
  const f = [...(e.clipboardData || {}).files || []].find((x) => x.type.startsWith("image/"));
  if (f) { e.preventDefault(); readImage(f); }
});

(async () => {
  try {
    const s = await api("/api/status");
    $("status").textContent = `model ${s.version} (${s.model}) · ${s.matches.toLocaleString()} matches · data: ${s.data_source}`;
    $("date").value = s.today;
    $("img-date").value = s.today;
    await initPickers();
  } catch (err) { showError("Could not start: " + err.message); $("status").textContent = "not ready"; }
})();
</script>
