[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "footypred"
version = "2.7.0"
description = "Offline football prediction focused on 1X2, O/U 2.5, team goals O/U 0.5-2.5 and BTTS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "matplotlib>=3.7",
    "rapidfuzz>=3.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
image = ["rapidocr_onnxruntime>=1.3", "Pillow>=9"]     # read fixtures from screenshots (offline)
claude = ["anthropic>=0.70"]                           # optional Claude vision reader
dev = ["pytest>=7"]

[project.scripts]
footy = "footypred.cli:main"

[tool.setuptools.packages.find]
include = ["footypred*"]

[tool.setuptools.package-data]
footypred = ["ui/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
